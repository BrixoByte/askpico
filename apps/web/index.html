<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/logo.png" />
    <link rel="icon" type="image/png" href="/assets/brand/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&display=swap"
    />
    <meta property="og:image" content="https://askpico.app/assets/brand/logo.png" />
    <meta name="twitter:image" content="https://askpico.app/assets/brand/logo.png" />
    <meta
      name="description"
      content="Pico - an all-in-one AI workspace for Urdu, Hindi, and Roman Urdu speakers."
    />
    <meta
      name="twitter:description"
      content="Pico - an all-in-one AI workspace for Urdu, Hindi, and Roman Urdu speakers."
    />
    <meta name="twitter:title" content="Pico" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Pico</title>
    <script>
      (function () {
        var m = document.cookie.match(/(?:^|;\s*)theme=(light|dark|system)/);
        var stored = null;
        try {
          stored = localStorage.getItem('pico_theme');
        } catch (e) {}
        var valid = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : null;
        var pref = (m && m[1]) || valid || 'light';
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.className = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.innerWidth < 768 || /PicoApp\//.test(navigator.userAgent)) {
        document.getElementById('root').innerHTML =
          '<div style="position:fixed;inset:0;z-index:100;display:flex;height:100dvh;width:100%;overflow:hidden;align-items:center;justify-content:center;background:#7A46E3"><img src="/assets/brand/logo.png" alt="Pico" style="width:144px;height:144px;object-fit:contain"></div>';
      }
    </script>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
